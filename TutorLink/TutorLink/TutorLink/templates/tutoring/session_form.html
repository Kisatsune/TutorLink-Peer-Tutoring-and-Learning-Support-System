{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ heading }}</h1>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <button type="submit" class="btn">Save</button>
    <a class="btn btn-small btn-secondary" href="{% url 'dashboard' %}">Cancel</a>
  </form>
</section>
{% endblock %}
